# Cấu hình đang phục vụ 18100 (bản G2, triển khai 29/09/2026; bản sao ở
# local-g2-deployed.yaml). Đổi cấu hình/hoàn tác theo docs/OPERATIONS.md.
# 05/10/2026: tra cứu chuyển từ `llm` sang `wikipedia_vi` + force_source_lookup.
audio:
  sample_rate: 16000
  frame_ms: 20
media:
  vad:
    backend: energy
    energy_threshold: 0.012
    start_frames: 2
    end_frames: 12
    pre_roll_ms: 320
conversation:
  streaming_first_phrase_chars: 48
  # system_prompt và tool_instruction là chữ ĐÃ ĐO: prompt giọng nói dài từng
  # làm tool calling rơi về 0/10. Sửa chữ thì chạy lại scripts/measure_tool_calling.py.
  system_prompt: Trả lời ngắn bằng tiếng Việt, không markdown.
  turn_detection:
    backend: heuristic
    silence_ms: 480
    max_silence_ms: 1400
  barge_in:
    enabled: true
    speech_frames: 6
    guard_ms: 150
  search:
    enabled: true
    # Câu xin tra cứu rõ ràng và câu hỏi vị trí địa danh luôn đi qua nguồn,
    # không để model tự quyết trả lời từ trí nhớ (sửa G4, đo 30/09).
    force_source_lookup: true
    max_inflight: 2
    ttl_ms: 60000
    delivery_prefix: Về câu bạn hỏi lúc nãy
    skip_redundant_ack: true
  tool_instruction: 'Bạn có các công cụ sau: {tools}. Đọc lại, lặp nguyên văn, dịch,
    trích dẫn hay tình huống giả định: chỉ trả lời theo văn bản, không gọi công cụ.
    {tool_routes} Kiến thức cố định và tính toán không cần tra cứu: trả lời trực tiếp.
    Khi cần công cụ, phải gọi rồi mới trả lời.'
  streaming_first_phrase_wait_ms: 250
  # Cắt im đầu/cuối từng cụm, đặt quãng nghỉ theo dấu câu, nén im dài trong
  # câu. Đo 02/10/2026: mỗi chỗ nối từng có 100–180 ms im bất kể dấu câu.
  pauses:
    enabled: true
  opener:
    enabled: true
    text: Vâng.
    after_ms: 800
models:
  keep_warm_s: 240
  mode: cascade
  asr:
    backend: gipformer
    options:
      model_dir: models/gipformer1.5-65M-rnnt
      precision: int8
      onnx_threads: 4
      lowercase: true
      # Không có dòng này thì gipformer không sinh partial nào và turn detector
      # heuristic chỉ nhận chuỗi rỗng (mọi luật từ nối/dãy số không chạy).
      partial_every_frames: 25
  llm:
    backend: openai_compat
    options:
      endpoint: http://127.0.0.1:18108/v1
      model: qwen3.5-4b
      max_tokens: 120
      temperature: 0.0
      enable_thinking: false
      keepalive_connections: 0
      timeout_s: 30.0
      max_parallel: 3
      max_queue: 8
      context_tokens: 4096
      prompt_budget_tokens: 1800
      native_tokenizer: true
      literal_request_policy: true
      extra_body:
        seed: 20260929
  tts:
    backend: zerotts
    options:
      voice: kimoanh
      revision: c2bfbd67dc648cac455077333f7cf5c18a2e3bb4
      local_files_only: true
      intra_op_num_threads: 4
      codec_intra_op_num_threads: 4
      max_queue: 6
      max_pending_chunks: 4
      max_chunk_frames: 8
  search:
    # Tra cứu có nguồn (05/10/2026). Bản `llm` cũ không có dữ liệu nào: nó trả
    # lời từ trí nhớ và từng khẳng định sai rất tự tin ("Hồ Hoàn Kiếm nằm trên
    # sông Hồng", "VinFast chưa niêm yết"). Wikipedia từ chối câu cần số liệu
    # tức thời hoặc dữ liệu riêng thay vì đoán. Không có readiness probe: mất
    # mạng chỉ làm lượt tra cứu báo không tra được, không làm 18100 thành 503.
    backend: wikipedia_vi
    options:
      timeout_s: 5.0
      max_chars: 500
      # Wikimedia bắt buộc có liên hệ người vận hành trong User-Agent.
      user_agent: VoicePlatform/0.1 (voice assistant evaluation; hoangnhatbk13@gmail.com)
  prewarm_before_sessions: true
tasks:
  tools:
  - clock
  max_parallel: 4
  max_queue: 16
server:
  host: 127.0.0.1
  port: 18100
  max_sessions: 3
  private_introspection: true
