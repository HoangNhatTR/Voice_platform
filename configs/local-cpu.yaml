# Stack tiếng Việt THẬT, không chạm GPU. Đã đo trên máy này 23/09/2026:
#   ASR gipformer   : nạp 2.9 s, giải mã 151 ms cho 9.3 s tiếng
#   LLM llama.cpp   : TTFT 673 ms (Qwen3.5-9B Q4 đang chạy sẵn ở cổng 8088)
#   TTS VieNeu Nano : RTF 0.65 trên CPU, peak 0.91 (nghe rõ)
#
# Điều kiện: chạy bằng interpreter có torch/onnxruntime, tức venv của
# speech2speech:
#   PYTHON=/home/ai01/AIHoang/speech2speech/.venv/bin/python \
#     ./scripts/dev.sh --config configs/local-cpu.yaml
#
# GPU đang bị chiếm (bộ nhớ hợp nhất GB10, 93/121 GB lúc đo) nên VieNeu bản
# cuda báo CUDA out of memory. Bản Nano chạy trong venv riêng qua subprocess,
# không đụng GPU, nên là đường đi được ngay.

audio:
  sample_rate: 16000
  frame_ms: 20

media:
  vad:
    backend: energy        # silero cần torch trong tiến trình; energy đã đủ trên giọng thật
    energy_threshold: 0.012
    start_frames: 2
    end_frames: 12
    pre_roll_ms: 320

conversation:
  # Ngắn là có chủ ý, không phải viết tạm. Bản dài ("tối đa hai câu, không
  # liệt kê...") đo được 0/10 lượt gọi công cụ trên Qwen3.5-9B; bản này 10/10,
  # 0 lượt gọi thừa. Sửa chữ ở đây thì chạy lại scripts/measure_tool_calling.py.
  system_prompt: "Trả lời sẽ được đọc thành tiếng: viết ngắn, không markdown."
  turn_detection:
    backend: heuristic
    silence_ms: 480
    max_silence_ms: 1400
  barge_in:
    enabled: true
    speech_frames: 6
    guard_ms: 150
  search:
    enabled: true
    max_inflight: 2
    ttl_ms: 60000
    delivery_prefix: "Về câu bạn hỏi lúc nãy"

models:
  mode: cascade
  asr:
    backend: gipformer
    options:
      model_dir: models/gipformer1.5-65M-rnnt
      precision: int8
      onnx_threads: 4
      lowercase: true
      # Không có dòng này thì KHÔNG có partial nào, và turn detector heuristic
      # chỉ nhận text rỗng — tức là luôn trả về silence_ms cơ sở, mọi luật
      # "từ nối / câu mở đầu / dãy số" đều không chạy. Giải mã lại cả prefix
      # mỗi 25 frame (500 ms); gipformer chạy trong thread riêng nên không
      # chặn vòng lặp audio.
      partial_every_frames: 25
  llm:
    backend: openai_compat
    options:
      endpoint: http://127.0.0.1:8088/v1
      model: qwen3.5-9b
      max_tokens: 120
      temperature: 0.6
      enable_thinking: false
      keepalive_connections: 0
  tts:
    # Chạy trong .deps/vieneu-nano-venv qua subprocess: coqui/vieneu kéo theo
    # dependency xung đột nên không cài chung được, và nó không cần GPU.
    backend: vieneu_nano
    options:
      expected_rtf: 0.65

  # "Back end - search" trong sơ đồ: một tác nhân RIÊNG lo tra cứu.
  # Ở đây nó trỏ vào cùng llama-server nhưng là một phiên khác với prompt
  # khác — tách vai trò trước, tách phần cứng sau. Đổi `endpoint` sang một
  # service khác là xong, Speech agent không biết gì.
  search:
    backend: llm
    options:
      endpoint: http://127.0.0.1:8088/v1
      model: qwen3.5-9b
      max_tokens: 160
      temperature: 0.3        # tra cứu thì cần ổn định, không cần bay bổng
      enable_thinking: false
      keepalive_connections: 0
      system_prompt: >-
        Bạn là bộ phận tra cứu. Trả lời NGẮN và CHÍNH XÁC bằng tiếng Việt, tối
        đa hai câu, chỉ nêu dữ kiện. Không chào hỏi. Nếu không chắc chắn, nói
        thẳng là không tra được.

tasks:
  tools: [clock]

server:
  host: 127.0.0.1
  port: 18100
