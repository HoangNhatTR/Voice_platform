[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-platform"
version = "0.1.0"
description = "Realtime voice platform: media, conversation, model and task planes"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "fastapi==0.139.2",
  "uvicorn==0.51.0",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "websockets==16.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Local engines are optional on purpose: the platform runs, serves and tests
# itself with no model installed.
silero = ["torch>=2.2", "silero-vad>=5.1"]
turn-training = ["scikit-learn==1.9.0"]

[project.scripts]
voiceplatform = "voiceplatform.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
