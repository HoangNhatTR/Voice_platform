[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-platform"
version = "0.1.0"
description = "Realtime voice platform: media, conversation, model and task planes"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Local engines are optional on purpose: the platform runs, serves and tests
# itself with no model installed.
silero = ["torch>=2.2", "silero-vad>=5.1"]

[project.scripts]
voiceplatform = "voiceplatform.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
